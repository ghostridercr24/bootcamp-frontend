<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SITO ATS Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="dashboard-container">
        
        <nav class="sidebar">
            <div class="logo">🚀 SITO ATS</div>
            <ul class="menu">
                <li class="active"><i class="fas fa-users"></i> Candidates</li>
                <li><i class="fas fa-chart-line"></i> Analytics</li>
                <li><i class="fas fa-cog"></i> Settings</li>
            </ul>
        </nav>

        <main class="main-content">
            
            <header>
                <div class="header-title">
                    <h1>Talent Base</h1>
                </div>

                <div class="header-actions">
                    <div class="search-box">
                        <i class="fas fa-search search-icon"></i>
                        <input type="text" id="search-input" placeholder="Search by name...">
                    </div>
                    <button id="add-btn" class="btn-neon">+ New Candidate</button>
                </div>
            </header>

            <div class="stats-grid">
                <div class="card">
                    <h3>Total Candidates</h3>
                    <p class="number" id="count-total">0</p>
                </div>
                <div class="card">
                    <h3>In Interview</h3>
                    <p class="number" id="count-interview">0</p>
                </div>
                <div class="card">
                    <h3>Hired</h3>
                    <p class="number" id="count-hired" style="color: #00ff88;">0</p>
                </div>
            </div>

            <div class="table-container">
                <table class="ats-table">
                    <thead>
                        <tr>
                            <th>Candidate Name</th>
                            <th>Position</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="candidate-list">
                        </tbody>
                </table>
                
                <div id="empty-state" class="empty-message">
                    <i class="fas fa-folder-open"></i>
                    <p>No candidates found.</p>
                </div>
            </div>

        </main>
    </div>

    <div id="modal" class="modal-overlay">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Add New Candidate</h2>
            <form id="ats-form">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="name" placeholder="Ex: Satoru Gojo" required>
                </div>
                
                <div class="form-group">
                    <label>Position</label>
                    <input type="text" id="position" placeholder="Ex: Frontend Dev" required>
                </div>

                <div class="form-group">
                    <label>Status</label>
                    <select id="status">
                        <option value="Interview">Interview</option>
                        <option value="Technical">Technical Test</option>
                        <option value="Hired">Hired</option>
                        <option value="Rejected">Rejected</option>
                    </select>
                </div>

                <button type="submit" class="btn-neon full-width">Save Candidate</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
